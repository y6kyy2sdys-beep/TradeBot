name: Quellen-Test (temporär)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://api.onvista.de/api/v1
          curl -s "$B/instruments/STOCK/82849/snapshot" > snap.json
          jq -c '[.quoteList.list[] | {n: .market.name, id: .market.idNotation}] | .[:12]' snap.json
          jq -c '.chart | keys?' snap.json; jq -c '.chart' snap.json | head -c 600; echo
          N=$(jq -r '[.quoteList.list[] | select(.market.codeExchange=="LSX")][0].market.idNotation' snap.json); echo "LSX=$N"
          for u in "chart_history?endDate=2026-11-23&idNotation=$N&resolution=1D&startDate=2025-11-01" \
                   "eod_history?idNotation=$N&range=Y1&startDate=2025-11-23" \
                   "chart_history?idNotation=$N&range=Y1" "chart_history?idNotation=$N&chartType=PRICE&range=D1&resolution=1M" ; do
            echo "== $u"; curl -s "$B/instruments/STOCK/82849/$u" | head -c 500; echo; done
          echo "== gettex Apple"; curl -s "$B/instruments/STOCK/86627/snapshot" | jq -c '[.quoteList.list[] | select(.market.codeExchange=="LSX" or .market.codeExchange=="GAT") | {n: .market.name, id: .market.idNotation, last, datetimeLast, isoCurrency}]'
          echo "== ETF"; curl -s "$B/instruments/query?searchValue=IE00B4L5Y983" | jq -c '.list[0] | {entityType, entityValue, name}'
