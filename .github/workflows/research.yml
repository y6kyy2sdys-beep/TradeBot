name: Research-Daten

on:
  schedule:
    - cron: "25 4 * * 1-6"   # täglich vor Börsenstart Europa (nach US-Schluss)
  workflow_dispatch:
    inputs:
      mode:
        description: "research oder probe"
        default: "research"

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Research ausführen
        run: |
          if [ "${{ github.event.inputs.mode }}" = "probe" ]; then python -m bot.probe; else python -m bot.research; fi
      - name: Speichern
        if: github.event.inputs.mode != 'probe'
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add docs/research.js state/research_cache.json
          if ! git diff --cached --quiet; then
            git commit -m "Research-Daten aktualisiert"
            for i in 1 2 3 4; do git pull --rebase -q origin master && git push && break; sleep 8; done
          fi
