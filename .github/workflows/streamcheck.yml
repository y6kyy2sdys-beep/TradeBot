name: Stream-Prüfung (Camera Wall)

on:
  schedule:
    - cron: "20 */8 * * *"   # alle 8 Stunden (YouTube-Kontingent: ca. 2.800 von 10.000 Einheiten je Lauf)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signals            # gleiche Gruppe wie die anderen Bots, damit sich die Pushes nicht überschneiden
  cancel-in-progress: false

jobs:
  streamcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.34.2
      - name: Quellen prüfen
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}   # optional; ohne Schlüssel werden nur Bildquellen geprüft
        run: python -m bot.streamcheck
      - name: Speichern
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add docs/streamstatus.js
          if ! git diff --cached --quiet; then
            git commit -m "Stream-Prüfung aktualisiert"
            for i in 1 2 3; do git pull --rebase -q origin master && git push && break; sleep 5; done
          fi
