<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYP · A.L.F.R.E.D. Designvarianten</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<!-- PROTOTYP für die Designauswahl (nur alfred-dev, nicht verlinkt). Echte Daten: world.js, doomsday.js, cameras.js, world-geo.js. -->
<style>
:root { --bg:#000; --text:#d6f5de; --muted:#6f9c7b; --line:rgba(0,255,65,.18); --line2:rgba(0,255,65,.45); --acc:#00ff41; --acc2:#c9a227;
  --live:#00ff41; --warn:#fab219; --down:#ff5c5c; --panel:rgba(2,10,5,.82); --font:"Share Tech Mono", ui-monospace, Menlo, monospace; --head:var(--font); }
body[data-theme="newsroom"] { --bg:#05070b; --text:#f2f4f7; --muted:#8a93a3; --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.35); --acc:#e8eaee; --acc2:#c9a227;
  --live:#ff3b30; --panel:rgba(10,13,19,.92); --head:"Helvetica Neue", Helvetica, Arial, sans-serif; }
body[data-theme="science"] { --bg:#02060d; --text:#cfe6f2; --muted:#6e8ea3; --line:rgba(120,200,255,.16); --line2:rgba(120,200,255,.45); --acc:#7fd4ff; --acc2:#c9a227;
  --live:#3ddc84; --panel:rgba(4,12,22,.86); }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:var(--font); overflow:hidden; }
a { color:inherit; }
.proto { position:fixed; right:10px; bottom:10px; z-index:50; font-size:10px; color:var(--muted); background:rgba(0,0,0,.6); border:1px solid var(--line); padding:3px 8px; letter-spacing:.1em; }
/* ---------- gemeinsame Bausteine ---------- */
.pill { display:inline-flex; align-items:center; gap:5px; border:1px solid currentColor; border-radius:999px; padding:0 7px; font-size:10px; letter-spacing:.14em; line-height:1.7; white-space:nowrap; }
.pill::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
.pill.live { color:var(--live); } .pill.delayed { color:var(--warn); } .pill.unk { color:var(--muted); } .pill.off { color:var(--down); }
.corner { position:relative; }
.corner::before,.corner::after { content:""; position:absolute; width:12px; height:12px; pointer-events:none; }
.corner::before { top:-1px; left:-1px; border-top:2px solid var(--acc2); border-left:2px solid var(--acc2); }
.corner::after { bottom:-1px; right:-1px; border-bottom:2px solid var(--acc); border-right:2px solid var(--acc); }
.tile { background:#000; border:1px solid var(--line); display:flex; flex-direction:column; min-width:0; min-height:0; }
.tile .th { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; padding:7px 10px; border-bottom:1px solid var(--line); }
.tile .th .who { min-width:0; font-size:10.5px; letter-spacing:.12em; color:var(--muted); text-transform:uppercase; }
.tile .th .who b { display:block; color:var(--text); font-weight:normal; letter-spacing:.03em; text-transform:none; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tile .th .r { display:flex; gap:6px; align-items:center; }
.fsb { background:transparent; border:1px solid var(--line); color:var(--muted); font-size:12px; padding:0 6px; }
.media { position:relative; flex:1; min-height:0; background:#000; }
.media iframe,.media img { position:absolute; inset:0; width:100%; height:100%; border:0; object-fit:cover; }
.tile .tf { display:flex; justify-content:space-between; gap:8px; padding:4px 10px; font-size:9.5px; letter-spacing:.1em; color:var(--muted); border-top:1px solid var(--line); }
.tag { display:inline-block; margin-left:4px; padding:0 5px; border:1px solid var(--warn); color:var(--warn); font-size:9px; letter-spacing:.05em; text-transform:none; }
canvas.globe { position:absolute; inset:0; width:100%; height:100%; display:block; }
/* ---------- Lagezentrale (Camera Wall) ---------- */
.wall { position:absolute; inset:0; display:grid; grid-template-rows:auto 1fr auto; }
.whead { display:flex; align-items:center; gap:18px; padding:12px 18px; border-bottom:1px solid var(--line); }
.whead .title { font-family:var(--head); letter-spacing:.32em; font-size:18px; color:var(--acc); }
.whead .title small { display:block; letter-spacing:.3em; font-size:9.5px; color:var(--muted); margin-top:3px; }
.whead .sp { flex:1; }
.whead .k { font-size:11px; color:var(--muted); letter-spacing:.12em; } .whead .k b { color:var(--text); font-weight:normal; }
.wbody { min-height:0; display:grid; gap:10px; padding:10px 18px; }
.wfoot { padding:7px 18px; border-top:1px solid var(--line); font-size:10px; color:var(--muted); letter-spacing:.08em; display:flex; gap:18px; white-space:nowrap; overflow:hidden; }
.rail { display:flex; flex-direction:column; gap:10px; min-height:0; }
.panel { background:var(--panel); border:1px solid var(--line); padding:10px 12px; font-size:11.5px; line-height:1.5; }
.panel h5 { margin:0 0 6px; font-weight:normal; color:var(--acc); letter-spacing:.24em; font-size:10.5px; }
.mini { position:relative; height:240px; }
/* Variante A: NOIR – 3×2 Kacheln + rechte Leiste */
body[data-theme="noir"] .wbody { grid-template-columns:1fr 1fr 1fr 300px; grid-template-rows:1fr 1fr; }
body[data-theme="noir"] .rail { grid-column:4; grid-row:1 / span 2; }
body[data-theme="noir"] .whead .title { color:var(--acc2); text-shadow:0 0 12px rgba(201,162,39,.35); }
/* Variante B: NEWSROOM – Hauptbild + Nebenkacheln, Bauchbinden, Laufband */
body[data-theme="newsroom"] .wbody { grid-template-columns:2fr 1fr 1fr; grid-template-rows:1fr 1fr; }
body[data-theme="newsroom"] .tile.hero { grid-column:1; grid-row:1 / span 2; }
body[data-theme="newsroom"] .tile .th { display:none; }
body[data-theme="newsroom"] .lower { position:absolute; left:0; right:0; bottom:0; display:flex; align-items:stretch; font-family:var(--head); z-index:2; }
body[data-theme="newsroom"] .lower .lv { background:#c4161c; color:#fff; font-weight:700; padding:6px 10px; letter-spacing:.06em; font-size:12px; display:flex; align-items:center; }
body[data-theme="newsroom"] .lower .lv.dl { background:#8a6a00; } body[data-theme="newsroom"] .lower .lv.uk { background:#3a3f48; }
body[data-theme="newsroom"] .lower .cap { flex:1; background:rgba(8,10,15,.88); padding:5px 12px; min-width:0; }
body[data-theme="newsroom"] .lower .cap b { display:block; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
body[data-theme="newsroom"] .lower .cap small { color:#aab2c0; font-size:11px; }
body[data-theme="newsroom"] .tile.hero .lower .cap b { font-size:19px; }
body[data-theme="newsroom"] .whead { background:#0b0e14; }
body[data-theme="newsroom"] .whead .title { font-weight:700; letter-spacing:.18em; color:#fff; }
body[data-theme="newsroom"] .ticker { display:flex; gap:0; background:#0b0e14; border-top:1px solid var(--line); font-family:var(--head); font-size:13px; white-space:nowrap; overflow:hidden; }
body[data-theme="newsroom"] .ticker .lbl { background:#c4161c; color:#fff; font-weight:700; padding:7px 14px; letter-spacing:.08em; }
body[data-theme="newsroom"] .ticker .run { padding:7px 14px; color:#e6e9ee; }
body[data-theme="newsroom"] .tile { border-color:#1b2130; }
body[data-theme="newsroom"] .corner::before { border-color:#c9a227; } body[data-theme="newsroom"] .corner::after { border-color:transparent; }
/* Variante C: SCIENCE – Kartenleiste links + 3×2 Kacheln mit Messdaten */
body[data-theme="science"] .wbody { grid-template-columns:320px 1fr 1fr 1fr; grid-template-rows:1fr 1fr; }
body[data-theme="science"] .rail { grid-column:1; grid-row:1 / span 2; }
body[data-theme="science"] .tile .meta { position:absolute; left:8px; top:8px; z-index:2; font-size:10px; color:#bfe6ff; background:rgba(2,8,16,.7); border:1px solid rgba(127,212,255,.35); padding:3px 6px; letter-spacing:.06em; }
body[data-theme="science"] .whead .title { color:#bfe6ff; }
/* ---------- CHRONOS ---------- */
.chronos { position:absolute; inset:0; }
.ch-top { position:absolute; left:0; right:0; top:0; display:flex; align-items:center; gap:16px; padding:14px 20px; z-index:3; }
.ch-top .title { font-family:var(--head); letter-spacing:.34em; font-size:17px; color:var(--acc); }
.ch-top .title small { display:block; font-size:9.5px; letter-spacing:.3em; color:var(--muted); margin-top:3px; }
.ch-tabs { display:flex; border:1px solid var(--line2); }
.ch-tabs button { background:transparent; color:var(--muted); border:0; border-right:1px solid var(--line2); padding:6px 14px; font-family:var(--font); letter-spacing:.16em; font-size:11px; }
.ch-tabs button:last-child { border-right:0; } .ch-tabs button.on { background:var(--acc); color:#000; }
.ch-side { position:absolute; right:20px; top:70px; bottom:120px; width:380px; z-index:3; display:flex; flex-direction:column; gap:10px; }
.ch-side .panel { font-size:12px; }
.alf-h { display:flex; align-items:center; gap:10px; padding-bottom:8px; border-bottom:1px solid var(--line); margin-bottom:8px; }
.alf-h b { color:var(--acc2); letter-spacing:.3em; font-weight:normal; } .alf-h small { display:block; color:var(--muted); font-size:9.5px; letter-spacing:.14em; }
.radar { width:14px; height:14px; border-radius:50%; border:1px solid var(--line2); position:relative; overflow:hidden; }
.radar::after { content:""; position:absolute; inset:0; background:conic-gradient(from 40deg, rgba(0,255,65,.6), transparent 28%); }
.kv { display:grid; grid-template-columns:1fr auto; gap:3px 12px; } .kv span { color:var(--muted); } .kv b { font-weight:normal; text-align:right; font-variant-numeric:tabular-nums; }
.src { margin-top:8px; color:var(--muted); font-size:10px; line-height:1.45; }
.ch-legend { display:flex; align-items:center; gap:8px; font-size:10px; color:var(--muted); }
.ch-legend i { display:inline-block; width:22px; height:9px; }
.ch-time { position:absolute; left:20px; right:20px; bottom:16px; z-index:3; }
.ctl { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.ctl button { background:transparent; border:1px solid var(--line2); color:var(--text); font-family:var(--font); padding:4px 10px; font-size:12px; }
.ctl .yr { font-size:34px; color:var(--acc); letter-spacing:.06em; margin:0 10px 0 6px; font-variant-numeric:tabular-nums; }
.ctl .spd button.on { background:var(--acc); color:#000; }
.ctl .note { margin-left:auto; font-size:11px; color:var(--muted); }
.axis { position:relative; height:46px; }
.axis .bands { position:absolute; left:0; right:0; top:0; height:10px; display:flex; }
.axis .bands div { height:100%; } .axis .bands .imf { background:var(--acc); opacity:.55; }
.axis .bands .none { background:repeating-linear-gradient(45deg, transparent 0 4px, rgba(255,255,255,.14) 4px 5px); border:1px solid var(--line); }
.axis .track { position:absolute; left:0; right:0; top:18px; height:2px; background:var(--line2); }
.axis .tick { position:absolute; top:14px; width:1px; height:10px; background:var(--line2); }
.axis .lab { position:absolute; top:26px; transform:translateX(-50%); font-size:10px; color:var(--muted); }
.axis .knob { position:absolute; top:11px; width:14px; height:16px; margin-left:-7px; background:var(--acc); box-shadow:0 0 12px var(--acc); }
.axis .bl { position:absolute; top:-14px; font-size:9.5px; color:var(--muted); letter-spacing:.08em; }
.banner { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:2; }
body[data-theme="newsroom"] .ch-top { background:linear-gradient(#05070b, transparent); }
body[data-theme="newsroom"] .ch-top .title { font-weight:700; color:#fff; letter-spacing:.2em; }
body[data-theme="newsroom"] .ch-side { left:20px; right:20px; top:auto; bottom:118px; width:auto; flex-direction:row; align-items:stretch; }
body[data-theme="newsroom"] .ch-side .panel { border-left:4px solid #c4161c; background:rgba(8,10,15,.9); }
body[data-theme="newsroom"] .ch-side #alf { flex:1; } body[data-theme="newsroom"] .ch-side #leg { width:320px; }
body[data-theme="newsroom"] .ch-side .kv { grid-template-columns:repeat(4, auto 1fr); }
body[data-theme="newsroom"] .alf-h b { color:#fff; font-family:var(--head); font-weight:700; letter-spacing:.2em; }
body[data-theme="newsroom"] .ctl .yr { color:#fff; font-family:var(--head); font-weight:700; }
body[data-theme="newsroom"] .axis .knob { background:#c4161c; box-shadow:none; }
body[data-theme="newsroom"] .axis .bands .imf { background:#e8eaee; opacity:.45; }
body[data-theme="science"] .ctl .yr { color:#bfe6ff; }
body[data-theme="science"] .ch-tabs button.on { background:#7fd4ff; }
@media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body data-theme="noir">
<div id="app"></div>
<div class="proto" id="protoTag"></div>
<script src="../vendor/d3.min.js"></script>
<script src="../vendor/topojson-client.min.js"></script>
<script src="../vendor/world-geo.js"></script>
<script src="../world.js"></script>
<script src="../doomsday.js"></script>
<script src="../cameras.js"></script>
<script>
(() => {
"use strict";
const Q = new URLSearchParams(location.search);
const THEME = ["noir", "newsroom", "science"].includes(Q.get("theme")) ? Q.get("theme") : "noir";
const VIEW = Q.get("view") === "chronos" ? "chronos" : "wall";
const STATIC = Q.get("static") === "1" || matchMedia("(prefers-reduced-motion: reduce)").matches;
document.body.dataset.theme = THEME;
document.getElementById("protoTag").textContent = `PROTOTYP · VARIANTE ${({ noir: "A · NOIR", newsroom: "B · NEWSROOM", science: "C · SCIENCE" })[THEME]} · ${VIEW === "wall" ? "LAGEZENTRALE" : "CHRONOS"}`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = (v, d = 1) => v == null ? "–" : v.toLocaleString("de-DE", { minimumFractionDigits: d, maximumFractionDigits: d });
const W = window.WORLD, DOOM = window.DOOM || {}, CAMS = window.CAMS;
const T = window.WORLD_TOPO;
const feats = topojson.feature(T, T.objects.countries).features.filter(f => f.id !== "010");
feats.forEach(f => f.iso = (window.ISO_NUM[f.id] || [])[0] || "");
const byIso = new Map(feats.map(f => [f.iso, f]));
const NAMES = { DEU: "Deutschland", USA: "USA", JPN: "Japan", FRA: "Frankreich", UKR: "Ukraine", CHN: "China", GBR: "Großbritannien", IND: "Indien", BRA: "Brasilien", RUS: "Russland", ITA: "Italien", CAN: "Kanada", KOR: "Südkorea" };
const nameOf = iso => NAMES[iso] || ((window.ISO_NUM && Object.values(window.ISO_NUM).find(([a]) => a === iso)) || [, iso])[1];
const borders = topojson.mesh(T, T.objects.countries, (a, b) => a !== b);
const coast = topojson.mesh(T, T.objects.countries, (a, b) => a === b);

/* ---------------- Globus-Renderer (d3-geo auf Canvas) ---------------- */
const GT = {
  noir:     { bg: "#000", star: "rgba(200,255,210,", atmo: "rgba(0,255,65,.16)", ocean1: "#03140a", ocean2: "#000603", land: "#0c2414", border: "rgba(0,255,65,.55)", glow: "rgba(0,255,65,.9)", blur: 6, grat: "rgba(0,255,65,.10)", rim: "rgba(0,255,65,.5)", hi: "#c9a227" },
  newsroom: { bg: "#03050a", star: "rgba(255,255,255,", atmo: "rgba(120,170,255,.18)", ocean1: "#0d1a33", ocean2: "#030812", land: "#1d2638", border: "rgba(230,236,245,.45)", glow: "rgba(255,255,255,.4)", blur: 2, grat: "rgba(255,255,255,.06)", rim: "rgba(200,220,255,.35)", hi: "#ff3b30" },
  science:  { bg: "#01040a", star: "rgba(190,225,255,", atmo: "rgba(90,180,255,.26)", ocean1: "#082037", ocean2: "#01070f", land: "#122a3b", border: "rgba(127,212,255,.6)", glow: "rgba(127,212,255,.8)", blur: 4, grat: "rgba(127,212,255,.12)", rim: "rgba(127,212,255,.6)", hi: "#c9a227" },
}[THEME];
function makeGlobe(canvas, opt) {
  const ctx = canvas.getContext("2d"), proj = d3.geoOrthographic().clipAngle(90).precision(0.6), path = d3.geoPath(proj, ctx), grat = d3.geoGraticule10();
  let w = 0, h = 0, R = 0, cx = 0, cy = 0, stars = null, rot = opt.rotate || [-10, -35, 0], anim = null;
  const g = { fill: () => null, markers: [], sel: null };
  function size() {
    const dpr = Math.min(2, devicePixelRatio || 1); w = canvas.clientWidth; h = canvas.clientHeight;
    canvas.width = w * dpr; canvas.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    R = Math.min(w, h) * (opt.r || .42); cx = w * (opt.cx || .5); cy = h * (opt.cy || .5); proj.scale(R).translate([cx, cy]);
    let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
    stars = Array.from({ length: opt.stars ?? 260 }, () => [rnd() * w, rnd() * h, rnd() * 1.1 + .2, rnd() * .6 + .15]);
  }
  function draw() {
    ctx.fillStyle = GT.bg; ctx.fillRect(0, 0, w, h);
    stars.forEach(([x, y, r, a]) => { ctx.fillStyle = GT.star + a + ")"; ctx.fillRect(x, y, r, r); });
    const at = ctx.createRadialGradient(cx, cy, R * .96, cx, cy, R * 1.28); at.addColorStop(0, GT.atmo); at.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = at; ctx.beginPath(); ctx.arc(cx, cy, R * 1.28, 0, 7); ctx.fill();
    proj.rotate(rot);
    const oc = ctx.createRadialGradient(cx - R * .35, cy - R * .4, R * .05, cx, cy, R); oc.addColorStop(0, GT.ocean1); oc.addColorStop(1, GT.ocean2);
    ctx.fillStyle = oc; ctx.beginPath(); path({ type: "Sphere" }); ctx.fill();
    ctx.beginPath(); path(grat); ctx.strokeStyle = GT.grat; ctx.lineWidth = .5; ctx.stroke();
    feats.forEach(f => { ctx.beginPath(); path(f); ctx.fillStyle = g.fill(f) || GT.land; ctx.fill(); });
    ctx.save(); ctx.shadowColor = GT.glow; ctx.shadowBlur = GT.blur;
    ctx.beginPath(); path(borders); ctx.strokeStyle = GT.border; ctx.lineWidth = .6; ctx.stroke();
    ctx.beginPath(); path(coast); ctx.lineWidth = .8; ctx.stroke(); ctx.restore();
    if (g.sel && byIso.get(g.sel)) { ctx.beginPath(); path(byIso.get(g.sel)); ctx.strokeStyle = GT.hi; ctx.lineWidth = 1.6; ctx.stroke(); }
    // Licht von oben links, Nachtseite unten rechts (rein gestalterisch, keine Tageszeit)
    const sh = ctx.createRadialGradient(cx - R * .5, cy - R * .5, R * .15, cx, cy, R * 1.05);
    sh.addColorStop(0, "rgba(255,255,255,.07)"); sh.addColorStop(.55, "rgba(0,0,0,0)"); sh.addColorStop(1, "rgba(0,0,0,.62)");
    ctx.fillStyle = sh; ctx.beginPath(); path({ type: "Sphere" }); ctx.fill();
    ctx.beginPath(); path({ type: "Sphere" }); ctx.strokeStyle = GT.rim; ctx.lineWidth = 1.1; ctx.stroke();
    const center = [-rot[0], -rot[1]];
    g.markers.forEach(m => { if (d3.geoDistance([m.lon, m.lat], center) > Math.PI / 2 - .05) return; const [x, y] = proj([m.lon, m.lat]);
      ctx.beginPath(); ctx.arc(x, y, m.r || 4, 0, 7); ctx.fillStyle = m.color; ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = "#000"; ctx.stroke();
      if (m.label) { ctx.fillStyle = "rgba(230,240,235,.9)"; ctx.font = "10px 'Share Tech Mono', monospace"; ctx.fillText(m.label, x + 7, y + 3); } });
  }
  g.flyTo = (lonlat, ms = 1600) => {
    const to = [-lonlat[0], -lonlat[1] + 8, 0], from = rot.slice();
    if (STATIC) { rot = to; draw(); return; }
    const ip = d3.interpolate(from, to); if (anim) anim.stop();
    anim = d3.timer(t => { const k = d3.easeCubicInOut(Math.min(1, t / ms)); rot = ip(k); draw(); if (k >= 1) { anim.stop(); anim = null; } });
  };
  g.spin = () => { if (STATIC) return; d3.timer(() => { if (anim) return; rot = [rot[0] + .05, rot[1], rot[2]]; draw(); }); };
  g.draw = draw; size(); addEventListener("resize", () => { size(); draw(); });
  return g;
}

/* ---------------- Lagezentrale (Camera Wall) ---------------- */
function wall() {
  const pick = ["deu-dw-news", "usa-bloomberg-tv", "jpn-nhk-world", "fra-paris-skyline", "usa-goes-conus", "ukr-gibs"];
  const items = pick.map(id => CAMS.items.find(c => c.id === id)).filter(Boolean).slice(0, THEME === "newsroom" ? 5 : 6);   // Newsroom: Hauptbild + 4
  const pad = n => String(n).padStart(2, "0");
  const url = c => { let u = c.embed.url; if (u.includes("{YYYY-MM-DD}")) { const d = new Date(Date.now() - 864e5); u = u.split("{YYYY-MM-DD}").join(`${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`); } return u; };
  const ART = { nachrichten: "Nachrichten-Livestream", panorama: "Panorama", wetter: "Wetter", zeitversetzt: "Zivile Übersicht · zeitversetzt" };
  const st = c => c.embed.url.includes("{YYYY") ? ["delayed", "DELAYED", "Tagesbild Vortag (UTC)"] : c.verzoegerung_min > 0 ? ["delayed", "DELAYED", `verzögert ca. ${c.verzoegerung_min} Min.`] : ["unk", "STAND UNBEKANNT", c.embed.typ === "skyline" ? "Vorschau · Stand unbekannt" : "Livestatus nicht prüfbar"];
  const media = c => c.embed.typ === "youtube" ? `<iframe src="${esc(c.embed.url)}&autoplay=1&mute=1&playsinline=1&rel=0" referrerpolicy="strict-origin" sandbox="allow-scripts allow-same-origin allow-presentation" allow="fullscreen" title="${esc(c.betreiber)}"></iframe>`
    : c.embed.typ === "skyline" ? `<a href="${esc(c.quelle_url)}" target="_blank" rel="noopener noreferrer"><img src="${esc(url(c))}" alt="${esc(c.betreiber)}" referrerpolicy="no-referrer"></a>`
    : `<img src="${esc(url(c))}" alt="${esc(c.betreiber)}" referrerpolicy="no-referrer">`;
  const tile = (c, i) => { const [cls, lab, when] = st(c);
    const lowerCls = cls === "delayed" ? "dl" : cls === "unk" ? "uk" : "";
    return `<div class="tile corner${THEME === "newsroom" && i === 0 ? " hero" : ""}">
      <div class="th"><div class="who">${esc(ART[c.art])}${c.kennzeichnung ? `<span class="tag">${esc(c.kennzeichnung)}</span>` : ""}<b>${esc(c.betreiber)} · ${esc(nameOf(c.iso))}</b>${esc(when)}</div>
        <div class="r"><span class="pill ${cls}">${lab}</span><button class="fsb" title="Vollbild">⛶</button></div></div>
      <div class="media">${media(c)}
        ${THEME === "science" ? `<div class="meta">${esc(c.iso)} · ${esc(c.ort)} · ${esc(c.art.toUpperCase())} · ${esc(c.embed.typ.toUpperCase())}</div>` : ""}
        ${THEME === "newsroom" ? `<div class="lower"><div class="lv ${lowerCls}">${cls === "delayed" ? "ZEITVERSETZT" : c.embed.typ === "youtube" ? "STREAM" : c.embed.typ === "skyline" ? "VORSCHAU" : "BILD"}</div><div class="cap"><b>${esc(nameOf(c.iso))} · ${esc(c.ort)}</b><small>${esc(c.betreiber)} · ${esc(when)}</small></div></div>` : ""}</div>
      <div class="tf"><span>${esc(c.credit || "Quelle: " + c.betreiber)}</span><span>QUELLE ↗ · LIZENZ ↗</span></div></div>`; };
  const hs = (DOOM.hotspots || []).filter(h => h.level >= 3).sort((a, b) => b.level - a.level);
  const clock = () => new Date().toISOString().slice(11, 16) + " UTC";
  const rail = `<div class="rail"><div class="panel corner"><h5>${THEME === "science" ? "QUELLENKARTE" : "GLOBUS · QUELLEN"}</h5><div class="mini"><canvas class="globe" id="mini"></canvas></div></div>
      <div class="panel"><h5>A.L.F.R.E.D. · LAGE</h5>${hs.slice(0, 5).map(h => `<div style="display:flex;justify-content:space-between;gap:8px"><span>${esc(h.name)}</span><b style="font-weight:normal;color:var(--warn)">${h.level}/5</b></div>`).join("")}
        <div class="src">Meldungsdichte 48 h (doomsday.js) · keine Positionsdaten</div></div>
      <div class="panel"><h5>REGELN</h5>Laden nur nach Zustimmung · Konfliktgebiete nur Nachrichten/zeitversetzt · Ton aus · keine Aufzeichnung</div></div>`;
  document.getElementById("app").innerHTML = `<div class="wall">
    <div class="whead"><div class="title">GLOBAL INTELLIGENCE NETWORK<small>WAYNE INTELLIGENCE · A.L.F.R.E.D. · LAGEZENTRALE</small></div><div class="sp"></div>
      <span class="k">QUELLEN <b>${items.length}/${CAMS.items.length}</b></span><span class="k">KATALOG <b>freigegeben ${esc(CAMS.stand)}</b></span><span class="k"><b>${clock()}</b></span>
      <button class="fsb" style="font-size:11px;padding:4px 10px">⛶ VOLLBILD-LAGEZENTRALE</button></div>
    <div class="wbody">${THEME !== "newsroom" && THEME === "science" ? rail : ""}${items.map(tile).join("")}${THEME === "noir" ? rail : ""}</div>
    ${THEME === "newsroom" ? `<div class="ticker"><span class="lbl">LAGE</span><span class="run">${hs.slice(0, 4).map(h => esc(h.name) + " — " + esc((h.news[0] || {}).title || "")).join("   ·   ")}</span></div>`
      : `<div class="wfoot"><span>STATUS: LIVE = Quelle sendet · DELAYED = zeitversetzt/Standbild · OFFLINE = nicht erreichbar · UNAVAILABLE = keine geprüfte Quelle</span><span>Quellen: freigegebener Katalog (cameras.js)</span></div>`}</div>`;
  const mini = document.getElementById("mini");
  if (mini) { const g = makeGlobe(mini, { r: .44, stars: 90, rotate: [-5, -40, 0] });
    g.markers = items.map(c => { const f = byIso.get(c.iso); const [lon, lat] = f ? d3.geoCentroid(f) : [0, 0]; return { lon, lat, r: 4, color: GT.hi, label: c.iso }; });
    g.draw(); g.flyTo([10, 42], 1); g.spin(); }
}

/* ---------------- PROJECT CHRONOS ---------------- */
function chronos() {
  const Y0 = 2026, Y1 = 2050, LAST = 2030;   // IMF WEO reicht bis 2030 – danach keine gestützten Länderdaten
  const MODES = { geo: "GEOPOLITIK", wirt: "WIRTSCHAFT", klima: "KLIMA" };
  let mode = Q.get("scen") in MODES ? Q.get("scen") : "wirt", year = +(Q.get("year") || 2028), speed = 1;
  const growth = (iso, y) => { const a = (W.indicators.NGDP_RPCH || {})[iso], i = W.years.indexOf(y); return a && i >= 0 ? a[i] : null; };
  const growthColor = v => v == null ? null : v <= -3 ? "#e66767" : v <= -1 ? "#a34a4a" : v < 1 ? "#4a4a46" : v < 3 ? "#1c5cab" : "#3987e5";
  const ESC = ["#1d2b22", "#92361f", "#c74726", "#f6623d", "#ff9b7f"];
  document.getElementById("app").innerHTML = `<div class="chronos"><canvas class="globe" id="cg"></canvas>
    <div class="ch-top"><div class="title">PROJECT CHRONOS<small>WAYNE INTELLIGENCE · ZEITACHSE 2026–2050 · NUR BELEGTE DATEN</small></div>
      <div class="ch-tabs">${Object.entries(MODES).map(([k, l]) => `<button class="${k === mode ? "on" : ""}">${l}</button>`).join("")}</div></div>
    <div class="ch-side"><div class="panel corner" id="alf"></div><div class="panel" id="leg"></div></div>
    <div class="ch-time"><div class="ctl"><button>⏮</button><button>${STATIC ? "▶" : "❚❚"}</button><span class="yr" id="yr"></span>
      <span class="spd">${[1, 2, 4].map(s => `<button class="${s === speed ? "on" : ""}">${s}×</button>`).join(" ")}</span>
      <span class="note" id="note"></span></div>
      <div class="axis" id="axis"></div></div></div>`;
  const g = makeGlobe(document.getElementById("cg"), THEME === "newsroom" ? { r: .40, cx: .5, cy: .40, stars: 420, rotate: [-10, -40, 0] }
    : { r: .36, cx: .40, cy: .47, stars: 420, rotate: [-10, -40, 0] });
  // Achse mit Datenabdeckung
  const ax = document.getElementById("axis"), pos = y => ((y - Y0) / (Y1 - Y0) * 100) + "%";
  ax.innerHTML = `<div class="bl" style="left:0">IMF-PROGNOSE (World Economic Outlook) ${Y0}–${LAST}</div><div class="bl" style="left:${pos(LAST + 1)}">AB ${LAST + 1}: KEINE GESTÜTZTEN LÄNDERDATEN – NICHTS WIRD FORTGESCHRIEBEN</div>
    <div class="bands"><div class="imf" style="width:${pos(LAST + .5)}"></div><div class="none" style="flex:1"></div></div><div class="track"></div>
    ${d3.range(Y0, Y1 + 1).map(y => `<div class="tick" style="left:${pos(y)};${y % 5 ? "height:5px;top:16px" : ""}"></div>${y % 4 === 2 || y === Y1 ? `<div class="lab" style="left:${pos(y)}">${y}</div>` : ""}`).join("")}
    <div class="knob" id="knob"></div>`;
  function render() {
    document.getElementById("yr").textContent = year; document.getElementById("knob").style.left = pos(year);
    const have = mode === "wirt" && year <= LAST, now = new Date().getFullYear();
    g.fill = f => mode === "wirt" ? (have ? growthColor(growth(f.iso, year)) : null) : mode === "geo" ? (W.escalation[f.iso] && W.escalation[f.iso].stufe ? ESC[W.escalation[f.iso].stufe] : null) : null;
    g.sel = "DEU"; g.draw();
    const vals = feats.map(f => [f.iso, growth(f.iso, year)]).filter(([, v]) => v != null);
    const sorted = [...vals].sort((a, b) => b[1] - a[1]), med = sorted.length ? d3.median(sorted, d => d[1]) : null;
    const alf = document.getElementById("alf");
    const head = `<div class="alf-h"><span class="radar"></span><div><b>A.L.F.R.E.D.</b><small>ANALYSE · ${MODES[mode]} · ${year}</small></div></div>`;
    if (mode === "wirt" && have) alf.innerHTML = head + `<div class="kv"><span>Länder mit Daten</span><b>${vals.length}</b><span>Median reales Wachstum</span><b>${nf(med)} %</b>
        <span>Deutschland</span><b>${nf(growth("DEU", year))} %</b><span>Negativ (&lt; 0 %)</span><b>${vals.filter(([, v]) => v < 0).length}</b></div>
        <div style="margin-top:8px">Höchstes Wachstum: ${sorted.slice(0, 3).map(([i, v]) => esc(nameOf(i)) + " " + nf(v) + " %").join(" · ")}</div>
        <div class="src">${year >= now ? "PROGNOSE des IMF (World Economic Outlook) – keine eigene Schätzung." : "Ist-Wert laut IMF."} Keine Eintrittswahrscheinlichkeiten. Stand world.js ${esc((W.generated || "").slice(0, 10))}.</div>`;
    else if (mode === "wirt") alf.innerHTML = head + `<div>Für ${year} liegen keine gestützten Länderdaten vor. Der IMF World Economic Outlook endet ${LAST}.</div>
        <div class="src">Ein früheres internes Szenariomodell (Fortschreibung, „Dystopie“-Schocks) wird in CHRONOS bewusst nicht verwendet.</div>`;
    else if (mode === "geo") alf.innerHTML = head + `<div>Geopolitik wird <b style="font-weight:normal;color:var(--warn)">nicht fortgeschrieben</b>. Gezeigt ist nur der heutige Stand: Eskalationsstufe aus der Zählung von Konflikt-Schlagzeilen und Krisenregionen (48 h).</div>
        <div class="kv" style="margin-top:8px"><span>Länder Stufe ≥ 3</span><b>${Object.values(W.escalation).filter(e => e.stufe >= 3).length}</b><span>Krisenregionen ≥ 3/5</span><b>${(DOOM.hotspots || []).filter(h => h.level >= 3).length}</b></div>
        <div class="src">Quelle: world.js/doomsday.js (Bot). Keine Prognose.</div>`;
    else alf.innerHTML = head + `<div><span class="pill unk">NICHT KONFIGURIERT</span></div><div style="margin-top:8px">Keine Klimadaten im Projekt. Mögliche geprüfte Quellen: IPCC AR6 (SSP-Pfade, global), World Bank Climate Change Knowledge Portal (CMIP6 je Land) – Lizenz/Abruf vor Einbindung prüfen.</div>
        <div class="src">Szenariopfade (SSP) wären Projektionen Dritter und würden als solche gekennzeichnet.</div>`;
    document.getElementById("leg").innerHTML = mode === "wirt" ? `<h5>LEGENDE · REALES BIP-WACHSTUM</h5><div class="ch-legend">${[["#e66767", "≤ −3"], ["#a34a4a", "−3…−1"], ["#4a4a46", "−1…1"], ["#1c5cab", "1…3"], ["#3987e5", "≥ 3 %"]].map(([c, l]) => `<i style="background:${c}"></i>${l}`).join(" ")}</div>`
      : mode === "geo" ? `<h5>LEGENDE · ESKALATION (HEUTE)</h5><div class="ch-legend">${ESC.slice(1).map((c, i) => `<i style="background:${c}"></i>${i + 1}`).join(" ")}</div>` : `<h5>LEGENDE</h5><div class="ch-legend">keine Daten</div>`;
    document.getElementById("note").textContent = mode === "wirt" ? (have ? "Datenbasis: IMF WEO" : "Kein Datensatz für dieses Jahr") : mode === "geo" ? "Nur heutiger Stand" : "Datenquelle nicht angebunden";
  }
  render(); g.flyTo([10, 51], 1); if (!STATIC) { g.flyTo([10, 48], 2200); }
}
VIEW === "wall" ? wall() : chronos();
})();
</script>
